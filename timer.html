<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>72-Hour Timer — Trigger Rewards</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-icon">T</span><span>TRIGGER<span class="gold"> REWARDS</span></span></a>
  </header>
  <main>
    <section class="page-hero wrap">
      <div class="eyebrow">REWARD STATUS</div>
      <h1>Your <span class="gold">timer.</span></h1>
      <p>Your code has been accepted. Keep track of the 72-hour waiting period below.</p>
    </section>
    <section class="wrap">
      <div class="flow-panel">
        <div class="eyebrow">TIME REMAINING</div>
        <div id="timer-value" class="timer-line" aria-live="polite">
          <span><b>72</b><small>HOURS</small></span><i>:</i>
          <span><b>00</b><small>MINUTES</small></span><i>:</i>
          <span><b>00</b><small>SECONDS</small></span>
        </div>
        <h2 id="timer-message">Your 72-hour waiting timer is running.</h2>
        <a id="timer-finish" class="button button-gold hidden" href="index.html">Return to code entry →</a>
        <p><a class="text-link" href="index.html">← Back to Trigger Rewards</a></p>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrap footer-bottom"><span>© <span data-year></span> Trigger Rewards</span><span>Trigger Rewards</span></div>
  </footer>
</body>
</html>
